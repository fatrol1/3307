<!doctype html><html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3307 / INSPECTOR</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#070c0d;color:#d8ede3;font:16px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace}main{max-width:780px;margin:7vh auto;padding:24px}.eyebrow{color:#7bbba4;letter-spacing:.22em;font-size:12px}h1{font-size:clamp(32px,7vw,60px);letter-spacing:.13em;font-weight:400;margin:12px 0}p{color:#b2c7bc}a{color:#9be5c5}input,button{background:#101f1c;color:#d9fff0;border:1px solid #476f60;border-radius:4px;padding:13px;font:inherit}button{cursor:pointer}button:hover{background:#1b3930}input{width:min(100%,340px)}.panel{border:1px solid #35584b;padding:24px;margin:28px 0}.muted{color:#79958a;font-size:13px}.hidden{display:none}.error{color:#ff9b9b}.good{color:#a6ffc8}img{max-width:100%;height:auto}code{overflow-wrap:anywhere}footer{margin-top:60px;color:#658779;font-size:12px}details{margin-top:25px;color:#9fb4a8}summary{cursor:pointer}</style></head><body><main><div class="eyebrow">3307 // TOOL</div><h1>BIT INSPECTOR</h1><p>Local browser tool. Select the original carrier.png. No file is uploaded.</p><input type="file" id="file" accept="image/png"><button id="go">READ RED LSB</button><pre id="out"></pre><footer>FOUR SIGNALS · ONE DESTINATION · NO ACCOUNTS REQUIRED</footer></main><script>document.querySelector('#go').onclick=async()=>{let f=document.querySelector('#file').files[0];if(!f)return;let bm=await createImageBitmap(f),c=document.createElement('canvas');c.width=bm.width;c.height=bm.height;let x=c.getContext('2d');x.drawImage(bm,0,0);let a=x.getImageData(0,0,c.width,c.height).data;let read=(start,count)=>{let n=0;for(let i=start;i<start+count;i++)n=(n<<1)|(a[i*4]&1);return n};let len=read(0,16);if(len>200){document.querySelector('#out').textContent='Invalid length. Use original PNG.';return}let bytes=[];for(let i=0;i<len;i++)bytes.push(read(16+i*8,8));document.querySelector('#out').textContent='DECODED: '+new TextDecoder().decode(new Uint8Array(bytes));};</script></body></html>
